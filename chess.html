<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Repertoire Trainer</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.cburnett.css">

    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight-color: rgba(155, 199, 0, 0.41);
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* =========================================
           GLOBAL COMPONENTS
        ========================================= */
        .hidden { display: none !important; }

        button, .btn-link {
            background: #4caf50; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
            transition: background 0.2s, opacity 0.2s; text-align: center;
            font-size: 14px; text-decoration: none; display: inline-flex;
            justify-content: center; align-items: center;
        }
        button:hover:not(:disabled), .btn-link:hover:not(:disabled) { background: #45a049; }
        button.secondary, .btn-link.secondary { background: #333; color: #ccc; }
        button.secondary:hover:not(:disabled), .btn-link.secondary:hover:not(:disabled) { background: #444; color: #fff; }
        button.danger { background: #c62828; }
        button.danger:hover:not(:disabled) { background: #d32f2f; }
        button:disabled, .btn-link:disabled { opacity: 0.4; cursor: not-allowed; }

        input[type="text"], select, textarea {
            width: 100%; background: var(--bg-color); color: #fff;
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 10px; font-family: inherit; font-size: 14px;
        }
        select { cursor: pointer; font-size: 15px; padding: 12px; background: var(--card-bg); }
        textarea { font-family: monospace; resize: vertical; min-height: 100px; }
        input:focus, select:focus, textarea:focus { outline: 1px solid #4caf50; }

        .radio-row { display: flex; gap: 15px; align-items: center; font-size: 14px; }
        .radio-row strong { min-width: 80px; }

        .toggle-row { display: flex; gap: 15px; margin-top: 10px; }
        .toggle-row .toggle-container { flex: 1; }

        /* Toggle Switch CSS */
        .toggle-container {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border-radius: 20px;
            padding: 4px;
            gap: 5px;
            position: relative;
        }
        .toggle-option {
            flex: 1;
            text-align: center;
            padding: 8px 15px;
            border-radius: 16px;
            cursor: pointer;
            z-index: 1;
            transition: color 0.3s;
            font-weight: bold;
            color: #888;
        }
        .toggle-option.active { color: #fff; }
        .toggle-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: #4caf50;
            border-radius: 16px;
            transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 0;
        }
        .toggle-container[data-state="left"] .toggle-slider { left: 4px; }
        .toggle-container[data-state="right"] .toggle-slider { left: calc(50%); }
        /* Variations of toggles */
        .toggle-container.color-toggle .toggle-slider { background: #888; }
        .toggle-container.color-toggle[data-state="left"] .toggle-slider { background: #f0d9b5; } /* White */
        .toggle-container.color-toggle[data-state="left"] .toggle-option:first-child { color: #333; }
        .toggle-container.color-toggle[data-state="right"] .toggle-slider { background: #b58863; } /* Black */

        /* =========================================
           SETUP VIEW (Dashboard)
        ========================================= */
        #setup-view {
            width: 100%; max-width: 800px;
            display: flex; flex-direction: column; gap: 20px;
            margin-top: 20px;
        }

        .header-title { text-align: center; margin-bottom: 10px; color: #4caf50; }

        .setup-card {
            background: var(--card-bg);
            padding: 25px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 15px;
            border: 1px solid var(--border-color);
        }

        .setup-card h2 { margin: 0 0 10px 0; font-size: 1.2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.9rem; color: #aaa; }

        /* =========================================
           CHAPTER SELECTION VIEW
        ========================================= */
        #chapter-view {
            width: 100%; max-width: 800px;
            display: flex; flex-direction: column; gap: 20px;
            margin-top: 20px;
        }
        .chapter-list {
            display: flex; flex-direction: column; gap: 10px;
            max-height: 400px; overflow-y: auto; padding-right: 10px;
        }
        .chapter-btn {
            background: #2a2a2a; color: #e0e0e0; border: 1px solid var(--border-color);
            padding: 15px; border-radius: 8px; cursor: pointer; text-align: left;
            transition: all 0.2s; font-size: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chapter-btn:hover { background: #333; border-color: #4caf50; }
        .chapter-btn.selected { background: #1e4620; border-color: #4caf50; color: #fff; font-weight: bold; }
        .chapter-count { font-style: italic; opacity: 0.8; font-size: 0.9rem; }

        /* =========================================
           TRAINING VIEW (App Container)
        ========================================= */
        #training-view {
            display: flex; flex-direction: row; gap: 30px;
            max-width: 1100px; width: 100%;
        }

        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 320px; }

        .stats-panel, .controls, .pgn-container {
            background: var(--card-bg); padding: 15px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .stat-row { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; }
        .stat-value { color: #4caf50; }
        .stat-error-val { color: #e57373; }

        .feedback {
            padding: 15px; border-radius: 8px; font-weight: bold; text-align: center;
            transition: all 0.3s; min-height: 50px; display: flex;
            align-items: center; justify-content: center;
        }
        .feedback.waiting { background: #2c3e50; color: #ecf0f1; }
        .feedback.success { background: #1e4620; color: #81c784; }
        .feedback.error { background: #5c1616; color: #e57373; }
        .feedback.warning { background: #b9770e; color: #fdf2e9; } 

        /* PGN & Comments Display */
        .pgn-container { gap: 0; padding: 0; background: transparent; }
        
        .active-line {
            width: 100%; min-height: 80px; max-height: 120px;
            background: var(--card-bg); color: #ccc;
            border: 1px solid var(--border-color); border-radius: 8px; padding: 12px;
            font-family: monospace; line-height: 1.8; overflow-y: auto;
            white-space: normal; word-wrap: break-word;
        }

        .comment-box {
            margin-top: 10px;
            background: #2a2a2a;
            border-left: 4px solid #4caf50;
            padding: 12px;
            border-radius: 0 6px 6px 0;
            font-size: 14px;
            color: #ddd;
            line-height: 1.4;
            min-height: 44px;
            transition: opacity 0.2s;
        }

        .pgn-move { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background 0.2s, color 0.2s; display: inline-block; }
        .pgn-move:hover { background: #333; color: #fff; }
        .pgn-move.active-move { background: #4caf50; color: #fff; font-weight: bold; }
        .move-number { color: #777; margin-left: 4px; }

        .row-buttons { display: flex; gap: 6px; flex-wrap: nowrap; }
        .row-buttons button, .row-buttons .btn-link { flex: 1; padding: 8px 4px; font-size: 12.5px; white-space: nowrap; }
        .row-buttons .nav-btn { flex: 0 0 32px; padding: 8px 0; }

        /* Board Styling */
        .board-wrapper { flex: 1.5; display: flex; flex-direction: column; position: relative; }
        .cg-wrap { width: 100%; aspect-ratio: 1 / 1; height: auto; }
        .cg-wrap cg-board {
            background-image: conic-gradient(var(--dark-sq) 90deg, var(--light-sq) 90deg 180deg, var(--dark-sq) 180deg 270deg, var(--light-sq) 270deg) !important;
            background-size: 25% 25% !important; 
        }
        .cg-wrap square.last-move { background-color: var(--highlight-color) !important; }
        .cg-wrap piece.movable { cursor: grab !important; }
        .cg-wrap piece.dragging { cursor: grabbing !important; }
        cg-board square.move-dest { background: radial-gradient(rgba(0, 0, 0, 0.15) 20%, transparent 20%); }

        @media (max-width: 768px) { #training-view { flex-direction: column-reverse; } }
    </style>
</head>
<body>

    <div id="setup-view">
        <h1 class="header-title">Chess Repertoire Trainer</h1>
        
        <div class="setup-card">
            <h2>Charger un répertoire</h2>
            
            <div class="toggle-container" id="sourceToggle" data-state="left" style="margin-bottom: 15px;">
                <div class="toggle-slider"></div>
                <div class="toggle-option active" data-val="lichess">Étude Lichess</div>
                <div class="toggle-option" data-val="pgn">Coller un PGN</div>
            </div>

            <div id="lichess-input-group" class="form-group">
                <label>Lien ou ID de l'étude publique :</label>
                <input type="text" id="lichessInput" placeholder="https://lichess.org/study/xxxxxx">
            </div>

            <div id="pgn-input-group" class="form-group hidden">
                <label>Texte PGN (Multi-chapitres supportés) :</label>
                <textarea id="quickPgnInput" placeholder="[Event &quot;Chapitre 1&quot;]&#10;1. e4 e5..."></textarea>
            </div>

            <button id="loadBtn" class="secondary" style="margin-top: 10px;">Charger le répertoire</button>
            <div id="lichessFeedback" style="color: #e57373; font-size: 14px; margin-top: 5px; display: none;"></div>
        </div>

        <div class="setup-card" id="config-card" style="display: none;">
            <h2 id="config-title">Configuration</h2>
            <div id="chapter-selection-area" class="hidden" style="margin-top: 10px;">
                <label style="font-size: 0.9rem; color: #aaa; margin-bottom: 5px; display: block;">Choix du chapitre :</label>
                <div class="chapter-list" id="chapterList" style="max-height: 250px;">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <div class="toggle-row">
                <div class="toggle-container color-toggle" id="colorToggle" data-state="left">
                    <div class="toggle-slider"></div>
                    <div class="toggle-option active" data-val="white">Blancs</div>
                    <div class="toggle-option" data-val="black">Noirs</div>
                </div>
                <div class="toggle-container" id="modeToggle" data-state="left">
                    <div class="toggle-slider"></div>
                    <div class="toggle-option active" data-val="decouverte">Découverte</div>
                    <div class="toggle-option" data-val="revision">Révision</div>
                </div>
            </div>

            <button id="startBtn" style="font-size: 16px; padding: 15px; margin-top: 10px;" disabled>Démarrer l'entraînement</button>
        </div>
    </div>

    <!-- TRAINING VIEW -->
    <div id="training-view" class="hidden">
        <div class="sidebar">
            <div id="trainingHeader" style="text-align: center; margin-bottom: 5px; font-weight: bold; color: #4caf50; font-size: 1.1rem;"></div>
            <div id="feedback" class="feedback waiting">Préparation...</div>
            
            <div class="stats-panel">
                <div class="stat-row"><span>Coups à apprendre :</span><span id="statMoves" class="stat-value">0 / 0</span></div>
                <div class="stat-row"><span>Variantes :</span><span id="statVars" class="stat-value">0 / 0</span></div>
                <div class="stat-row" id="errorStatRow"><span>Erreurs :</span><span id="statErrors" class="stat-error-val">0</span></div>
            </div>

            <div class="pgn-container">
                <div id="activeLineDisplay" class="active-line">Position initiale</div>
                <div id="commentBox" class="comment-box"><em>Aucun commentaire pour ce coup.</em></div>
            </div>
            
            <div class="controls">
                <div class="row-buttons">
                    <button id="prevBtn" class="secondary nav-btn" disabled>◀</button>
                    <button id="nextBtn" class="secondary nav-btn" disabled>▶</button>
                    <button id="toggleCommentsBtn" class="secondary">Masquer Notes</button>
                    <button id="hintBtn" class="secondary">Aide</button>
                    <a id="analysisLink" href="#" target="_blank" class="secondary btn-link">Analyse ↗</a>
                </div>
                <button id="stopBtn" class="danger" style="margin-top: 5px;">Quitter l'entraînement</button>
            </div>
        </div>

        <div class="board-wrapper">
            <div id="board" class="cg-wrap"></div>
        </div>
    </div>

    <script type="module">
        import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/+esm';
        import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.0.5/+esm';
        import { parseMultiPgn, buildRepertoireTree } from './data.js';

        // =========================================
        // TOGGLE LOGIC
        // =========================================
        const getToggleState = (id) => {
            const activeOpt = document.getElementById(id).querySelector('.toggle-option.active');
            return activeOpt ? activeOpt.dataset.val : null;
        };

        const setToggleState = (id, value) => {
            const container = document.getElementById(id);
            const options = container.querySelectorAll('.toggle-option');
            options.forEach(opt => {
                if (opt.dataset.val === value) {
                    opt.classList.add('active');
                    container.dataset.state = (opt === options[0]) ? 'left' : 'right';
                } else opt.classList.remove('active');
            });
        };

        document.querySelectorAll('.toggle-container').forEach(container => {
            container.querySelectorAll('.toggle-option').forEach(option => {
                option.addEventListener('click', (e) => setToggleState(container.id, e.target.dataset.val));
            });
        });

        // =========================================
        // APPLICATION STATE
        // =========================================
        const game = new Chess();
        let cg, rootNode = null, currentNode = null, playerColor = 'white', trainingMode = 'decouverte', isTraining = false, commentsVisible = true;
        let currentRepertoire = null, currentChapterIndex = -1, selectedChapterPgn = null, currentPath = [], viewIndex = 0;
        let totalMoves = 0, learnedMoves = 0, totalVariations = 0, learnedVariations = 0, errorCount = 0, currentMoveErrorLogged = false;

        const setupView = document.getElementById('setup-view'), configCard = document.getElementById('config-card'), trainingView = document.getElementById('training-view');
        const startBtn = document.getElementById('startBtn'), loadBtn = document.getElementById('loadBtn'), lichessInput = document.getElementById('lichessInput'), lichessFeedback = document.getElementById('lichessFeedback');
        const quickPgnInput = document.getElementById('quickPgnInput'), configTitle = document.getElementById('config-title');
        const chapterListEl = document.getElementById('chapterList'), chapterSelectionArea = document.getElementById('chapter-selection-area');
        
        const sourceToggle = document.getElementById('sourceToggle');
        const lichessGroup = document.getElementById('lichess-input-group');
        const pgnGroup = document.getElementById('pgn-input-group');

        // =========================================
        // SETUP & FETCH LOGIC
        // =========================================
        
        // Handle Source Toggle switching
        sourceToggle.querySelectorAll('.toggle-option').forEach(option => {
            option.addEventListener('click', () => {
                const val = getToggleState('sourceToggle');
                if (val === 'lichess') {
                    lichessGroup.classList.remove('hidden');
                    pgnGroup.classList.add('hidden');
                } else {
                    lichessGroup.classList.add('hidden');
                    pgnGroup.classList.remove('hidden');
                }
                configCard.style.display = 'none'; // Reset config on toggle
            });
        });

        const showConfigCard = (title, chapters) => {
            currentRepertoire = { title, chapters };
            configTitle.textContent = `Configuration : ${title}`;
            configCard.style.display = 'flex';
            updateChapterList();
            configCard.scrollIntoView({ behavior: 'smooth' });
        };

        const updateChapterList = () => {
            if (!currentRepertoire) return;
            playerColor = getToggleState('colorToggle');
            chapterListEl.innerHTML = '';
            selectedChapterPgn = null;
            currentChapterIndex = -1;

            if (currentRepertoire.chapters.length === 1) {
                chapterSelectionArea.classList.add('hidden');
                selectedChapterPgn = currentRepertoire.chapters[0].pgn;
                currentChapterIndex = 0;
                startBtn.disabled = false;
            } else {
                chapterSelectionArea.classList.remove('hidden');
                startBtn.disabled = true;
                currentRepertoire.chapters.forEach((chap, idx) => {
                    let moveCount = 0;
                    try {
                        const tempRoot = buildRepertoireTree(chap.pgn);
                        const countMoves = (n) => {
                            if (n.id !== 'root' && n.color === playerColor) moveCount++;
                            n.children.forEach(countMoves);
                        };
                        countMoves(tempRoot);
                    } catch(e) {}

                    const btn = document.createElement('button');
                    btn.className = 'chapter-btn';
                    btn.innerHTML = `<span>${chap.title}</span><span class="chapter-count">${moveCount} coups</span>`;
                    btn.onclick = () => {
                        document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedChapterPgn = chap.pgn;
                        currentChapterIndex = idx;
                        startBtn.disabled = false;
                    };
                    chapterListEl.appendChild(btn);
                });
            }
        };

        document.getElementById('colorToggle').addEventListener('click', () => setTimeout(updateChapterList, 50));

        loadBtn.addEventListener('click', async () => {
            const source = getToggleState('sourceToggle');
            lichessFeedback.style.display = 'none';
            configCard.style.display = 'none';

            if (source === 'lichess') {
                const input = lichessInput.value.trim();
                if (!input) return;
                
                let studyId = input;
                const match = input.match(/lichess\.org\/study\/([a-zA-Z0-9]+)/);
                if (match) studyId = match[1];

                loadBtn.disabled = true;
                loadBtn.textContent = "Chargement...";

                try {
                    const response = await fetch(`https://lichess.org/api/study/${studyId}.pgn`, {
                        headers: { 'Accept': 'application/x-chess-pgn' }
                    });
                    
                    if (!response.ok) {
                        if (response.status === 404) throw new Error("Étude non trouvée. Vérifiez l'ID.");
                        throw new Error("Erreur Lichess : " + response.statusText);
                    }
                    
                    const pgnText = await response.text();
                    const chapters = parseMultiPgn(pgnText);
                    if (chapters.length === 0) throw new Error("L'étude semble vide ou invalide.");
                    
                    showConfigCard(`Étude Lichess (${studyId})`, chapters);
                } catch (err) {
                    console.error("Fetch error:", err);
                    let errorMsg = err.message;
                    if (err.name === 'TypeError' && window.location.protocol === 'file:') {
                        errorMsg = "Bloqué par le navigateur (CORS). Pour corriger : lancez un serveur local ou utilisez l'entraînement rapide.";
                    }
                    lichessFeedback.textContent = errorMsg;
                    lichessFeedback.style.display = 'block';
                } finally {
                    loadBtn.disabled = false;
                    loadBtn.textContent = "Charger le répertoire";
                }
            } else {
                const pgnText = quickPgnInput.value.trim();
                if (!pgnText) { alert("Veuillez coller un PGN."); return; }
                const chapters = parseMultiPgn(pgnText);
                if (chapters.length === 0) { alert("Aucun chapitre valide trouvé."); return; }
                showConfigCard("Entraînement Rapide (PGN)", chapters);
            }
        });

        startBtn.addEventListener('click', () => {
            if (!selectedChapterPgn || currentChapterIndex === -1) return;
            const chapterTitle = currentRepertoire.chapters[currentChapterIndex].title;
            startTrainingSession(selectedChapterPgn, chapterTitle);
        });

        const startTrainingSession = (pgn, chapterTitle) => {
            playerColor = getToggleState('colorToggle');
            trainingMode = getToggleState('modeToggle');
            try { rootNode = buildRepertoireTree(pgn); } catch (err) { alert("Erreur lors de la lecture du PGN."); return; }
            initializeStats(rootNode);
            if (totalMoves === 0) { alert("Aucun coup trouvé pour cette couleur dans ce chapitre."); return; }
            trainingHeaderEl.textContent = `${currentRepertoire.title} > ${chapterTitle}`;
            if (trainingMode === 'decouverte') { errorStatRow.classList.add('hidden'); hintBtn.classList.add('hidden'); } 
            else { errorStatRow.classList.remove('hidden'); hintBtn.classList.remove('hidden'); }
            isTraining = true;
            setupView.classList.add('hidden');
            trainingView.classList.remove('hidden');
            if (!cg) cg = Chessground(boardEl, { coordinates: true, movable: { color: undefined, dests: new Map() } });
            cg.set({ orientation: playerColor }); game.load(rootNode.fen); updateAnalysisLink(); startNextVariation();
        };

        stopBtn.addEventListener('click', () => {
            isTraining = false; trainingView.classList.add('hidden'); setupView.classList.remove('hidden');
            game.reset(); cg.set({ drawable: { autoShapes: [] } });
        });

        toggleCommentsBtn.addEventListener('click', () => {
            commentsVisible = !commentsVisible;
            commentBox.classList.toggle('hidden', !commentsVisible);
            toggleCommentsBtn.textContent = commentsVisible ? "Masquer Notes" : "Afficher Notes";
        });

        const setFeedback = (msg, state) => { feedbackEl.textContent = msg; feedbackEl.className = `feedback ${state}`; };
        const updateStatsUI = () => { statMovesEl.textContent = `${learnedMoves} / ${totalMoves}`; statVarsEl.textContent = `${learnedVariations} / ${totalVariations}`; statErrorsEl.textContent = errorCount; };
        const updateAnalysisLink = () => { analysisLink.href = `https://lichess.org/analysis/standard/${game.fen().replace(/ /g, '_')}`; };
        const updateNavButtons = () => { prevBtn.disabled = (viewIndex === 0); nextBtn.disabled = (currentPath.length === 0 || viewIndex === currentPath.length - 1); };

        const updateCommentDisplay = () => {
            const node = (currentPath.length === 0 || viewIndex === 0) ? rootNode : currentPath[viewIndex];
            commentBox.innerHTML = node && node.comment ? `<strong>Notes :</strong> ${node.comment}` : `<em>Aucun commentaire pour ce coup.</em>`;
        };

        const renderPgnHtml = () => {
            if (currentPath.length <= 1) { activeLineDisplay.innerHTML = "Position initiale"; updateCommentDisplay(); return; }
            const startFenParts = rootNode.fen.split(' ');
            let fullMoveNum = parseInt(startFenParts[5]) || 1, currentTurn = startFenParts[1] === 'w' ? 'white' : 'black', html = '';
            for (let i = 1; i < currentPath.length; i++) {
                const node = currentPath[i];
                if (currentTurn === 'white') html += `<span class="move-number">${fullMoveNum}.</span> `;
                else if (i === 1) html += `<span class="move-number">${fullMoveNum}...</span> `;
                html += `<span class="pgn-move ${i === viewIndex ? 'active-move' : ''}" data-index="${i}">${node.san}</span> `;
                if (currentTurn === 'black') { fullMoveNum++; currentTurn = 'white'; } else currentTurn = 'black';
            }
            activeLineDisplay.innerHTML = html.trim();
            const activeElement = activeLineDisplay.querySelector('.active-move');
            if (activeElement) activeElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            updateCommentDisplay();
        };

        const navigateView = (step) => {
            if (!isTraining || currentPath.length === 0) return;
            const newIndex = viewIndex + step;
            if (newIndex < 0 || newIndex >= currentPath.length || newIndex === viewIndex) return;
            viewIndex = newIndex; updateNavButtons(); renderPgnHtml();
            const node = currentPath[viewIndex]; game.load(node.fen);
            cg.set({ fen: game.fen(), lastMove: node.id !== 'root' ? [node.from, node.to] : null });
            updateAnalysisLink();
            if (viewIndex < currentPath.length - 1) { cg.set({ movable: { dests: new Map() } }); cg.set({ drawable: { autoShapes: [] } }); } 
            else if (!node.isCompleted && game.turn() === playerColor[0]) preparePlayerTurn(); else cg.set({ movable: { dests: new Map() } });
        };

        prevBtn.addEventListener('click', () => navigateView(-1));
        nextBtn.addEventListener('click', () => navigateView(1));
        document.addEventListener('keydown', (e) => {
            if (!isTraining || currentPath.length === 0) return;
            if (e.key === 'ArrowLeft') navigateView(-1); else if (e.key === 'ArrowRight') navigateView(1);
        });
        activeLineDisplay.addEventListener('click', (e) => {
            if (e.target.classList.contains('pgn-move')) navigateView(parseInt(e.target.getAttribute('data-index')) - viewIndex);
        });

        const updateActiveLineDisplay = () => {
            if (!currentNode || !isTraining) return;
            let path = [], curr = currentNode;
            while (curr) { path.unshift(curr); curr = curr.parent; }
            currentPath = path; viewIndex = currentPath.length - 1; updateNavButtons(); renderPgnHtml(); updateAnalysisLink();
        };

        hintBtn.addEventListener('click', () => {
            if (!currentNode || game.turn() !== playerColor[0] || viewIndex < currentPath.length - 1) return;
            const uncompleted = currentNode.children.filter(c => !c.isCompleted);
            if (uncompleted.length > 0) cg.set({ drawable: { autoShapes: [{ orig: uncompleted[0].from, brush: 'green' }] } });
        });

        const initializeStats = (node) => {
            totalMoves = 0; learnedMoves = 0; totalVariations = 0; learnedVariations = 0; errorCount = 0; currentMoveErrorLogged = false; 
            const traverse = (n) => {
                if (n.id !== 'root' && n.color === playerColor) totalMoves++;
                if (n.children.length === 0 && n.id !== 'root') { n.isLeaf = true; totalVariations++; }
                n.children.forEach(traverse);
            };
            traverse(node); updateStatsUI();
        };

        const markNodeCompleted = (node) => {
            node.isCompleted = true; if (node.isLeaf) learnedVariations++;
            let parent = node.parent;
            while (parent && parent.id !== 'root') { if (parent.children.every(c => c.isCompleted)) parent.isCompleted = true; parent = parent.parent; }
            if (rootNode.children.every(c => c.isCompleted)) rootNode.isCompleted = true;
            updateStatsUI();
        };

        const getNextPath = (node) => {
            if (!node) return null;
            if (node.isLeaf && !node.isCompleted) return [node];
            const uncompleted = node.children.find(c => !c.isCompleted);
            return uncompleted ? [node, ...getNextPath(uncompleted)] : null;
        };

        const preparePlayerTurn = () => {
            setFeedback("À vous de jouer", "waiting");
            cg.set({ turnColor: playerColor, movable: { color: playerColor, free: false, showDests: true, dests: (() => {
                const dests = new Map(); game.moves({ verbose: true }).forEach(m => { if (!dests.has(m.from)) dests.set(m.from, []); dests.get(m.from).push(m.to); }); return dests;
            })(), events: { after: onUserMove } } });
            if (trainingMode === 'decouverte') {
                const uncompleted = currentNode.children.filter(c => !c.isCompleted);
                if (uncompleted.length > 0) cg.set({ drawable: { autoShapes: [{ orig: uncompleted[0].from, dest: uncompleted[0].to, brush: 'green' }] } });
            }
        };

        const onUserMove = (orig, dest) => {
            cg.set({ movable: { dests: new Map() } }); cg.set({ drawable: { autoShapes: [] } }); 
            const moveObj = game.moves({ verbose: true }).find(m => m.from === orig && m.to === dest && (m.promotion ? m.promotion === 'q' : true));
            const chosenChild = currentNode.children.find(c => c.san === (moveObj ? moveObj.san : null));
            if (!moveObj || !chosenChild) {
                if (trainingMode === 'revision') { if (!currentMoveErrorLogged) { errorCount++; currentMoveErrorLogged = true; updateStatsUI(); } setFeedback("Incorrect", "error"); }
                else setFeedback("Suivez la flèche !", "warning");
                setTimeout(() => { cg.set({ fen: game.fen() }); preparePlayerTurn(); }, 600); return;
            }
            if (chosenChild.isCompleted) { setFeedback("Déjà couvert", "warning"); setTimeout(() => { cg.set({ fen: game.fen() }); preparePlayerTurn(); }, 600); return; }
            currentMoveErrorLogged = false; setFeedback("Correct", "success");
            game.move({ from: orig, to: dest, promotion: 'q' }); cg.set({ fen: game.fen(), lastMove: [orig, dest] }); 
            currentNode = chosenChild; updateActiveLineDisplay();
            if (!currentNode.isVisited) { currentNode.isVisited = true; learnedMoves++; updateStatsUI(); }
            if (currentNode.isLeaf) { markNodeCompleted(currentNode); handleVariationEnd(); } 
            else setTimeout(() => playOpponentMove(), 250);
        };

        const playOpponentMove = (targetNode = null) => {
            cg.set({ drawable: { autoShapes: [] } });
            let nodeToPlay = targetNode || currentNode.children.find(c => !c.isCompleted);
            if (nodeToPlay) {
                game.move({ from: nodeToPlay.from, to: nodeToPlay.to, promotion: 'q' });
                cg.set({ fen: game.fen(), lastMove: [nodeToPlay.from, nodeToPlay.to] });
                currentNode = nodeToPlay; currentNode.isVisited = true; updateActiveLineDisplay();
                if (currentNode.isLeaf) { markNodeCompleted(currentNode); handleVariationEnd(); } 
                else preparePlayerTurn();
            }
        };

        const handleVariationEnd = () => {
            if (rootNode.isCompleted) {
                const msg = trainingMode === 'revision' ? `Répertoire complété ! Erreurs : ${errorCount} (${totalMoves > 0 ? ((errorCount / totalMoves) * 100).toFixed(1) : 0}%)` : `Répertoire complété (Mode Découverte)`;
                setFeedback(msg, "success");
                if (currentRepertoire && currentChapterIndex < currentRepertoire.chapters.length - 1) {
                    const nextBtn = document.createElement('button');
                    nextBtn.textContent = "Chapitre Suivant"; nextBtn.style.marginTop = "10px";
                    nextBtn.onclick = () => {
                        currentChapterIndex++;
                        selectedChapterPgn = currentRepertoire.chapters[currentChapterIndex].pgn;
                        startTrainingSession(selectedChapterPgn, currentRepertoire.chapters[currentChapterIndex].title);
                    };
                    feedbackEl.appendChild(document.createElement('br'));
                    feedbackEl.appendChild(nextBtn);
                }
            } else { setFeedback("Correct", "success"); setTimeout(startNextVariation, 1000); }
        };

        const startNextVariation = () => {
            cg.set({ drawable: { autoShapes: [] } }); currentMoveErrorLogged = false; 
            const path = getNextPath(rootNode); if (!path) return;
            let commonNode = path[0]; for (let i = 1; i < path.length; i++) if (path[i].isVisited) commonNode = path[i]; else break;
            const proceed = () => {
                const nextNode = path[path.indexOf(commonNode) + 1];
                if (nextNode) { if (nextNode.color !== playerColor) setTimeout(() => playOpponentMove(nextNode), 400); else preparePlayerTurn(); }
            };
            if (commonNode.id !== 'root') {
                setFeedback("Nouvelle variante...", "warning");
                currentNode = commonNode.parent; updateActiveLineDisplay(); game.load(currentNode.fen); cg.set({ fen: game.fen(), lastMove: null });
                setTimeout(() => {
                    game.move({ from: commonNode.from, to: commonNode.to, promotion: 'q' });
                    cg.set({ fen: game.fen(), lastMove: [commonNode.from, commonNode.to] });
                    currentNode = commonNode; updateActiveLineDisplay(); setTimeout(proceed, 600);
                }, 800);
            } else { currentNode = commonNode; updateActiveLineDisplay(); game.load(currentNode.fen); cg.set({ fen: game.fen(), lastMove: null }); proceed(); }
        };
    </script>
</body>
