<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Repertoire Trainer</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.cburnett.css">

    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight-color: rgba(155, 199, 0, 0.41);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        /* Sidebar & UI */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 320px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
            transition: opacity 0.3s;
        }

        /* PGN Display Styling */
        .active-line {
            width: 100%;
            min-height: 120px;
            max-height: 150px;
            background: #1e1e1e;
            color: #ccc;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            line-height: 1.8;
            overflow-y: auto;
            white-space: normal; /* Force text wrapping */
            word-wrap: break-word;
        }

        .pgn-move {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            display: inline-block; /* Helps with clean line wrapping */
        }

        .pgn-move:hover {
            background: #333;
            color: #fff;
        }

        .pgn-move.active-move {
            background: #4caf50;
            color: #fff;
            font-weight: bold;
        }

        .move-number {
            color: #777;
            margin-left: 4px;
        }

        .hidden { display: none !important; }

        .controls, .stats-panel {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Buttons Row Formatting */
        .row-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap; /* Prevent breaking into multiple lines */
        }

        .row-buttons button, 
        .row-buttons .btn-link {
            flex: 1;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 8px 4px;
            font-size: 12.5px;
            white-space: nowrap;
        }

        /* Specifically target navigation arrows to save space */
        .row-buttons .nav-btn {
            flex: 0 0 32px;
            padding: 8px 0;
        }

        .radio-group { display: flex; gap: 15px; }

        button, .btn-link {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            text-align: center;
        }

        button:hover:not(:disabled), .btn-link:hover:not(:disabled) { background: #45a049; }
        
        button.secondary, .btn-link.secondary { background: #333; color: #ccc; }
        button.secondary:hover:not(:disabled), .btn-link.secondary:hover:not(:disabled) { background: #444; color: #fff; }

        button:disabled, .btn-link:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Stats Panel */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .stat-value { color: #4caf50; }
        .stat-error-val { color: #e57373; }

        /* Feedback Banner */
        .feedback {
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feedback.waiting { background: #2c3e50; color: #ecf0f1; }
        .feedback.success { background: #1e4620; color: #81c784; }
        .feedback.error { background: #5c1616; color: #e57373; }
        .feedback.warning { background: #b9770e; color: #fdf2e9; } 

        /* Board Styling */
        .board-wrapper {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .cg-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
        }

        .cg-wrap cg-board {
            background-image: conic-gradient(
                var(--dark-sq) 90deg, 
                var(--light-sq) 90deg 180deg, 
                var(--dark-sq) 180deg 270deg, 
                var(--light-sq) 270deg
            ) !important;
            background-size: 25% 25% !important; 
        }

        .cg-wrap square.last-move {
            background-color: var(--highlight-color) !important;
        }

        .cg-wrap piece.movable { cursor: grab !important; }
        .cg-wrap piece.dragging { cursor: grabbing !important; }

        cg-board square.move-dest { background: radial-gradient(rgba(0, 0, 0, 0.15) 20%, transparent 20%); }
        cg-board square.move-dest.oc { background: radial-gradient(transparent 0%, transparent 75%, rgba(0, 0, 0, 0.25) 75%); }

        @media (max-width: 768px) {
            .app-container { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div id="feedback" class="feedback waiting">En attente d'un PGN...</div>
            
            <div class="stats-panel">
                <div class="stat-row">
                    <span>Coups à apprendre :</span>
                    <span id="statMoves" class="stat-value">0 / 0</span>
                </div>
                <div class="stat-row">
                    <span>Variantes :</span>
                    <span id="statVars" class="stat-value">0 / 0</span>
                </div>
                <div class="stat-row">
                    <span>Erreurs :</span>
                    <span id="statErrors" class="stat-error-val">0</span>
                </div>
            </div>

            <textarea id="pgnInput" placeholder="Collez votre PGN avec variantes (ou tag [FEN]) ici..."></textarea>
            <div id="activeLineDisplay" class="active-line hidden">Position initiale</div>
            
            <div class="controls">
                <div class="row-buttons">
                    <button id="prevBtn" class="secondary nav-btn" disabled>◀</button>
                    <button id="nextBtn" class="secondary nav-btn" disabled>▶</button>
                    <button id="togglePgnBtn" class="secondary">Masquer PGN</button>
                    <button id="hintBtn" class="secondary">Aide</button>
                    <a id="analysisLink" href="#" target="_blank" class="secondary btn-link">Analyse ↗</a>
                </div>
                <div class="radio-group">
                    <label><input type="radio" name="color" value="white" checked> Jouer les Blancs</label>
                    <label><input type="radio" name="color" value="black"> Jouer les Noirs</label>
                </div>
                <button id="startBtn">Démarrer l'entraînement</button>
            </div>
        </div>

        <div class="board-wrapper">
            <div id="board" class="cg-wrap"></div>
        </div>
    </div>

    <script type="module">
        import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/+esm';
        import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.0.5/+esm';

        // State variables
        const game = new Chess();
        let cg;
        let rootNode = null;
        let currentNode = null;
        let playerColor = 'white';
        let isTraining = false;

        // Navigation state variables
        let currentPath = [];
        let viewIndex = 0;

        // Stats & Error tracking
        let totalMoves = 0;
        let learnedMoves = 0;
        let totalVariations = 0;
        let learnedVariations = 0;
        let errorCount = 0;
        let currentMoveErrorLogged = false;

        // DOM Elements
        const pgnInput = document.getElementById('pgnInput');
        const activeLineDisplay = document.getElementById('activeLineDisplay');
        const startBtn = document.getElementById('startBtn');
        const togglePgnBtn = document.getElementById('togglePgnBtn');
        const hintBtn = document.getElementById('hintBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const analysisLink = document.getElementById('analysisLink');
        const feedbackEl = document.getElementById('feedback');
        const statMovesEl = document.getElementById('statMoves');
        const statVarsEl = document.getElementById('statVars');
        const statErrorsEl = document.getElementById('statErrors');
        const boardWrapper = document.querySelector('.board-wrapper');
        const boardEl = document.getElementById('board');

        // Initialize Chessground
        cg = Chessground(boardEl, {
            coordinates: true,
            movable: { color: undefined, dests: new Map() }
        });

        // Dynamic UI Toggles for PGN visibility
        togglePgnBtn.addEventListener('click', () => {
            const targetEl = isTraining ? activeLineDisplay : pgnInput;
            targetEl.classList.toggle('hidden');
            const isHidden = targetEl.classList.contains('hidden');
            togglePgnBtn.textContent = isHidden ? "Afficher PGN" : "Masquer PGN";
        });

        const setFeedback = (msg, state) => {
            feedbackEl.textContent = msg;
            feedbackEl.className = `feedback ${state}`;
        };

        const updateStatsUI = () => {
            statMovesEl.textContent = `${learnedMoves} / ${totalMoves}`;
            statVarsEl.textContent = `${learnedVariations} / ${totalVariations}`;
            statErrorsEl.textContent = errorCount;
        };

        const updateAnalysisLink = () => {
            const fen = game.fen().replace(/ /g, '_');
            analysisLink.href = `https://lichess.org/analysis/standard/${fen}`;
        };

        const updateNavButtons = () => {
            prevBtn.disabled = (viewIndex === 0);
            nextBtn.disabled = (currentPath.length === 0 || viewIndex === currentPath.length - 1);
        };

        // Renders the PGN with clickable elements and proper spaces for wrapping
        const renderPgnHtml = () => {
            if (currentPath.length <= 1) {
                activeLineDisplay.innerHTML = "Position initiale";
                return;
            }

            const startFenParts = rootNode.fen.split(' ');
            let fullMoveNum = parseInt(startFenParts[5]) || 1;
            let currentTurn = startFenParts[1] === 'w' ? 'white' : 'black';

            let html = '';
            for (let i = 1; i < currentPath.length; i++) {
                const node = currentPath[i];
                
                if (currentTurn === 'white') {
                    // Space added after the element to allow wrapping
                    html += `<span class="move-number">${fullMoveNum}.</span> `;
                } else if (i === 1) {
                    html += `<span class="move-number">${fullMoveNum}...</span> `;
                }

                const activeClass = (i === viewIndex) ? 'active-move' : '';
                // Space added after the element to allow wrapping
                html += `<span class="pgn-move ${activeClass}" data-index="${i}">${node.san}</span> `;

                if (currentTurn === 'black') {
                    fullMoveNum++;
                    currentTurn = 'white';
                } else {
                    currentTurn = 'black';
                }
            }
            
            activeLineDisplay.innerHTML = html.trim();

            const activeElement = activeLineDisplay.querySelector('.active-move');
            if (activeElement) {
                activeElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        };

        // Navigation Engine
        const navigateView = (step) => {
            if (!isTraining || currentPath.length === 0) return;
            
            const newIndex = viewIndex + step;
            if (newIndex < 0 || newIndex >= currentPath.length) return;
            if (newIndex === viewIndex) return;

            viewIndex = newIndex;
            updateNavButtons();
            renderPgnHtml();

            const node = currentPath[viewIndex];
            game.load(node.fen);

            let lastMove = null;
            if (node.id !== 'root') {
                lastMove = [node.from, node.to];
            }

            cg.set({ fen: game.fen(), lastMove: lastMove });
            updateAnalysisLink();

            if (viewIndex < currentPath.length - 1) {
                lockBoard();
                clearHints();
            } else {
                if (!node.isCompleted && game.turn() === playerColor[0]) {
                    preparePlayerTurn(); 
                } else {
                    lockBoard();
                }
            }
        };

        prevBtn.addEventListener('click', () => navigateView(-1));
        nextBtn.addEventListener('click', () => navigateView(1));

        document.addEventListener('keydown', (e) => {
            if (!isTraining || currentPath.length === 0) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                navigateView(-1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                navigateView(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                navigateView(-viewIndex); 
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                navigateView((currentPath.length - 1) - viewIndex); 
            }
        });

        boardWrapper.addEventListener('wheel', (e) => {
            if (!isTraining || currentPath.length === 0) return;
            e.preventDefault(); 
            if (e.deltaY < 0) {
                navigateView(-1); 
            } else if (e.deltaY > 0) {
                navigateView(1);  
            }
        }, { passive: false });

        activeLineDisplay.addEventListener('click', (e) => {
            if (e.target.classList.contains('pgn-move')) {
                const targetIndex = parseInt(e.target.getAttribute('data-index'));
                const step = targetIndex - viewIndex;
                if (step !== 0) navigateView(step);
            }
        });

        const updateActiveLineDisplay = () => {
            if (!currentNode || !isTraining) return;
            
            let path = [];
            let curr = currentNode;
            while (curr) {
                path.unshift(curr);
                curr = curr.parent;
            }
            
            currentPath = path;
            viewIndex = currentPath.length - 1; 
            
            updateNavButtons();
            renderPgnHtml();
            updateAnalysisLink();
        };

        const clearHints = () => {
            cg.set({ drawable: { autoShapes: [] } });
        };

        hintBtn.addEventListener('click', () => {
            if (!currentNode || game.turn() !== playerColor[0] || viewIndex < currentPath.length - 1) return;
            
            const uncompleted = currentNode.children.filter(c => !c.isCompleted);
            if (uncompleted.length > 0) {
                const hintNode = uncompleted[0]; 
                cg.set({
                    drawable: { autoShapes: [{ orig: hintNode.from, brush: 'green' }] }
                });
            }
        });

        const buildRepertoireTree = (pgnText) => {
            const fenMatch = pgnText.match(/\[FEN\s+"([^"]+)"\]/i);
            const startFen = fenMatch ? fenMatch[1] : new Chess().fen();

            const cleanPgn = pgnText.replace(/\[.*?\]/g, '').replace(/\{.*?\}/g, '').replace(/\$\d+/g, '').replace(/\d+\.+/g, ' ').trim();
            const tokens = cleanPgn.match(/[a-zA-Z0-9\-+=#KQRBN]+|\(|\)/g) || [];

            const root = { id: 'root', san: 'root', fen: startFen, children: [], parent: null, isCompleted: false, isVisited: true, isLeaf: false };
            let current = root;
            
            let tempGame = new Chess(startFen);
            let nodeStack = [];
            let idCounter = 0;

            for (let token of tokens) {
                if (token === '(') {
                    nodeStack.push(current);
                    current = current.parent;
                    tempGame.load(current.fen);
                } else if (token === ')') {
                    current = nodeStack.pop();
                    tempGame.load(current.fen);
                } else {
                    try {
                        const moveObj = tempGame.move(token);
                        if (moveObj) {
                            const newNode = {
                                id: 'node_' + (idCounter++),
                                san: moveObj.san,
                                from: moveObj.from,
                                to: moveObj.to,
                                fen: tempGame.fen(),
                                color: moveObj.color === 'w' ? 'white' : 'black',
                                children: [],
                                parent: current,
                                isCompleted: false,
                                isVisited: false,
                                isLeaf: false
                            };
                            current.children.push(newNode);
                            current = newNode;
                        }
                    } catch (e) {
                        console.warn("Skipped invalid token:", token);
                    }
                }
            }
            return root;
        };

        const initializeStats = (node) => {
            totalMoves = 0; 
            learnedMoves = 0; 
            totalVariations = 0; 
            learnedVariations = 0; 
            errorCount = 0;
            currentMoveErrorLogged = false; 

            const traverse = (n) => {
                if (n.id !== 'root' && n.color === playerColor) totalMoves++;
                if (n.children.length === 0 && n.id !== 'root') {
                    n.isLeaf = true;
                    totalVariations++;
                }
                n.children.forEach(traverse);
            };
            traverse(node);
            updateStatsUI();
        };

        const markNodeCompleted = (node) => {
            node.isCompleted = true;
            if (node.isLeaf) learnedVariations++;
            
            let parent = node.parent;
            while (parent && parent.id !== 'root') {
                if (parent.children.every(c => c.isCompleted)) parent.isCompleted = true;
                parent = parent.parent;
            }
            if (rootNode.children.every(c => c.isCompleted)) rootNode.isCompleted = true;
            updateStatsUI();
        };

        const getNextPath = (node) => {
            if (!node) return null;
            if (node.isLeaf && !node.isCompleted) return [node];
            const uncompleted = node.children.find(c => !c.isCompleted);
            if (!uncompleted) return null;
            const rest = getNextPath(uncompleted);
            return rest ? [node, ...rest] : null;
        };

        const getDests = () => {
            const dests = new Map();
            game.moves({ verbose: true }).forEach(m => {
                if (!dests.has(m.from)) dests.set(m.from, []);
                dests.get(m.from).push(m.to);
            });
            return dests;
        };

        const lockBoard = () => cg.set({ movable: { dests: new Map() } });

        const unlockBoard = () => {
            cg.set({
                turnColor: playerColor,
                movable: {
                    color: playerColor,
                    free: false,
                    showDests: true,
                    dests: getDests(),
                    events: { after: onUserMove }
                }
            });
        };

        const onUserMove = (orig, dest) => {
            lockBoard(); 
            clearHints(); 

            const moves = game.moves({ verbose: true });
            const moveObj = moves.find(m => m.from === orig && m.to === dest && (m.promotion ? m.promotion === 'q' : true));

            const chosenChild = currentNode.children.find(c => c.san === (moveObj ? moveObj.san : null));

            if (!moveObj || !chosenChild) {
                if (!currentMoveErrorLogged) {
                    errorCount++;
                    currentMoveErrorLogged = true;
                    updateStatsUI();
                }
                snapBack("Incorrect", "error");
                return;
            }

            if (chosenChild.isCompleted) {
                snapBack("Déjà couvert", "warning");
                return;
            }

            currentMoveErrorLogged = false; 
            
            setFeedback("Correct", "success");
            game.move({ from: orig, to: dest, promotion: 'q' });
            cg.set({ fen: game.fen(), lastMove: [orig, dest] }); 
            
            currentNode = chosenChild;
            updateActiveLineDisplay();

            if (!currentNode.isVisited) {
                currentNode.isVisited = true;
                learnedMoves++;
                updateStatsUI();
            }

            if (currentNode.isLeaf) {
                markNodeCompleted(currentNode);
                handleVariationEnd();
            } else {
                setTimeout(() => playOpponentMove(), 250);
            }
        };

        const snapBack = (msg, state) => {
            setFeedback(msg, state);
            setTimeout(() => {
                cg.set({ fen: game.fen() });
                preparePlayerTurn(); 
            }, 600);
        };

        const playOpponentMove = (targetNode = null) => {
            clearHints();
            let nodeToPlay = targetNode || currentNode.children.find(c => !c.isCompleted);

            if (nodeToPlay) {
                game.move({ from: nodeToPlay.from, to: nodeToPlay.to, promotion: 'q' });
                cg.set({ fen: game.fen(), lastMove: [nodeToPlay.from, nodeToPlay.to] });
                
                currentNode = nodeToPlay;
                currentNode.isVisited = true; 
                updateActiveLineDisplay();

                if (currentNode.isLeaf) {
                    markNodeCompleted(currentNode);
                    handleVariationEnd();
                } else {
                    preparePlayerTurn();
                }
            }
        };

        const preparePlayerTurn = () => {
            setFeedback("À vous de jouer", "waiting");
            unlockBoard();
        };

        const handleVariationEnd = () => {
            if (rootNode.isCompleted) {
                const errorRate = totalMoves > 0 ? ((errorCount / totalMoves) * 100).toFixed(1) : 0;
                setFeedback(`Répertoire complété ! Erreurs : ${errorCount} (${errorRate}%)`, "success");
            } else {
                setFeedback("Correct", "success");
                setTimeout(startNextVariation, 1000);
            }
        };

        const startNextVariation = () => {
            clearHints();
            currentMoveErrorLogged = false; 
            
            const path = getNextPath(rootNode);
            if (!path) return;

            let commonNode = path[0]; 
            for (let i = 1; i < path.length; i++) {
                if (path[i].isVisited) {
                    commonNode = path[i];
                } else {
                    break;
                }
            }

            const proceedFromCommonNode = () => {
                const nextNodeIndex = path.indexOf(commonNode) + 1;
                if (nextNodeIndex < path.length) {
                    const nextNode = path[nextNodeIndex];
                    if (nextNode.color !== playerColor) {
                        setTimeout(() => playOpponentMove(nextNode), 400);
                    } else {
                        preparePlayerTurn();
                    }
                }
            };

            if (commonNode.id !== 'root') {
                setFeedback("Nouvelle variante...", "warning");
                
                currentNode = commonNode.parent;
                updateActiveLineDisplay(); 

                game.load(currentNode.fen);
                cg.set({ fen: game.fen(), lastMove: null });
                lockBoard();

                setTimeout(() => {
                    game.move({ from: commonNode.from, to: commonNode.to, promotion: 'q' });
                    cg.set({ fen: game.fen(), lastMove: [commonNode.from, commonNode.to] });
                    
                    currentNode = commonNode; 
                    updateActiveLineDisplay();
                    
                    setTimeout(proceedFromCommonNode, 600);
                }, 800);

            } else {
                currentNode = commonNode;
                updateActiveLineDisplay();
                game.load(currentNode.fen);
                cg.set({ fen: game.fen(), lastMove: null });
                proceedFromCommonNode();
            }
        };

        startBtn.addEventListener('click', () => {
            const rawPgn = pgnInput.value.trim();
            if (!rawPgn) {
                setFeedback("Veuillez entrer un PGN", "error");
                return;
            }

            playerColor = document.querySelector('input[name="color"]:checked').value;
            clearHints();
            
            try {
                rootNode = buildRepertoireTree(rawPgn);
            } catch (err) {
                setFeedback("Erreur de parsing du PGN", "error");
                return;
            }

            initializeStats(rootNode);

            if (totalMoves === 0) {
                setFeedback("Aucun coup trouvé pour votre couleur", "error");
                return;
            }

            isTraining = true;
            pgnInput.classList.add('hidden');
            activeLineDisplay.classList.remove('hidden');
            togglePgnBtn.textContent = "Masquer PGN";
            
            cg.set({ orientation: playerColor });
            game.load(rootNode.fen); 
            updateAnalysisLink(); 
            startNextVariation();
        });
        
        updateAnalysisLink();
    </script>
</body>
</html>
