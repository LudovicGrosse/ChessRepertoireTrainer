name: Node.js CI

on:
  push:
    branches: ['master', 'deploy-online']
  pull_request:
    branches: ['master', 'deploy-online']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code quality (Linting)
        run: npm run lint

      - name: Run automated API tests (Fast)
        run: npm test

      - name: Install Playwright Browsers (Heavy - Only if [ui] in commit)
        if: contains(github.event.head_commit.message, '[ui]')
        run: npx playwright install --with-deps

      - name: Run automated UI tests (Playwright - Only if [ui] in commit)
        if: contains(github.event.head_commit.message, '[ui]')
        run: npx playwright test

      - name: Deploy to Render (Production)
        if: success()
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Deployment signal sent to Render"
