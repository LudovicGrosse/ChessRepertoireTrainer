name: Node.js CI

on:
  push:
    branches: [ "master", "deploy-online" ]
  pull_request:
    branches: [ "master", "deploy-online" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run automated API tests
      run: npm test
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run automated UI tests (Playwright)
      run: npx playwright test

    - name: Deploy to Render (Production)
      if: success() && matrix.node-version == '24.x'
      run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Deployment signal sent to Render"
